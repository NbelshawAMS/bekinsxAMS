button.disabled=true;status.style.color='#66796d';status.textContent='Unlocking…';
try{
const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(envelope.salt),iterations:envelope.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt','encrypt']);
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(envelope.iv)},key,bytes(envelope.ciphertext));
const html=new TextDecoder('utf-8',{fatal:true}).decode(plain);password.value='';
window.downloadEncryptedHTML=async html=>{
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(html));
 const next={...envelope,iv:b64(iv),ciphertext:b64(new Uint8Array(ciphertext))};
 const output=shell.replace(/(<script id="encrypted-payload" type="application\/json">)[\s\S]*?(<\/script>)/,(_,start,end)=>start+JSON.stringify(next)+end);
 const url=URL.createObjectURL(new Blob([output],{type:'text/html'})),a=document.createElement('a');a.href=url;a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
document.open();document.write(html);document.close();
}catch{status.style.color='#a12c23';status.textContent='Incorrect password. Please try again.';password.focus();password.select();button.disabled=false}
});
})();
