<script>
'use strict';
(()=>{
const shell='<!doctype html>\n'+document.documentElement.outerHTML;
const envelope=JSON.parse(document.getElementById('encrypted-payload').textContent);
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=a=>{let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const form=document.getElementById('unlockForm'),button=document.getElementById('unlockButton'),status=document.getElementById('status'),password=document.getElementById('password');
form.addEventListener('submit',async e=>{
e.preventDefault();if(!window.crypto?.subtle){status.textContent='Open in Chrome or Edge, or use the GitHub Pages HTTPS link.';return}
button.disabled=true;status.style.color='#66796d';status.textContent='Unlocking…';
try{
const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(envelope.salt),iterations:envelope.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt','encrypt']);
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(envelope.iv)},key,bytes(envelope.ciphertext));

};
